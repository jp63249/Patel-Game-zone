<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patel Game Zone</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#101329;color:white
}
header{
 text-align:center;padding:25px 10px;
 background:linear-gradient(135deg,#5417a8,#e52e71)
}
h1{margin:0;font-size:28px}
.coins{
 margin:15px auto;background:#25294b;
 padding:15px;border-radius:14px;
 text-align:center;max-width:350px
}
.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;padding:15px;max-width:700px;margin:auto
}
.card{
 background:#222644;border:1px solid #41476b;
 border-radius:15px;padding:15px 8px;text-align:center
}
.icon{font-size:38px}
button{
 border:0;border-radius:9px;padding:11px 14px;
 background:#ffbd35;color:#171329;font-weight:bold;
 cursor:pointer;margin:5px
}
#game{
 display:none;text-align:center;background:#222644;
 border-radius:15px;margin:10px auto;padding:20px;
 max-width:500px
}
#result{min-height:28px;color:#69f5c5}
#gameArea{margin:15px auto}
footer{text-align:center;padding:25px;color:#b9bdd8;font-size:13px}
.tile{width:58px;height:55px;padding:5px;font-size:18px}
.memcard{width:55px;height:55px;padding:5px;font-size:24px}
@media(max-width:350px){
 .grid{gap:7px;padding:8px}
 .card{padding:10px 4px}
 .tile{width:48px}
}
</style>
</head>

<body>

<header>
<h1>🎮 PATEL GAME ZONE</h1>
<p>Play • Enjoy • Have Fun!</p>
</header>

<div class="coins">
🪙 Virtual Coins: <b id="coins">1000</b>
</div>

<div class="grid">
 <div class="card"><div class="icon">🧩</div><h3>Number Puzzle</h3><button onclick="puzzle()">Play</button></div>
 <div class="card"><div class="icon">✈️</div><h3>Aeroplane Race</h3><button onclick="race()">Play</button></div>
 <div class="card"><div class="icon">🃏</div><h3>Andar Bahar</h3><button onclick="andar()">Play</button></div>
 <div class="card"><div class="icon">🎰</div><h3>Lucky Slots</h3><button onclick="slots()">Play</button></div>
 <div class="card"><div class="icon">🎡</div><h3>Lucky Wheel</h3><button onclick="wheel()">Play</button></div>
 <div class="card"><div class="icon">🪙</div><h3>Coin Flip</h3><button onclick="flip()">Play</button></div>
 <div class="card"><div class="icon">🧠</div><h3>Memory Match</h3><button onclick="memory()">Play</button></div>
</div>

<div id="game">
 <h2 id="gameTitle">Game</h2>
 <p id="gameText"></p>
 <div id="gameArea"></div>
 <p id="result"></p>
 <button onclick="closeGame()">⬅ Back to Games</button>
</div>

<footer>
Free-to-play demo • Virtual coins have no cash value.<br>
Patel Game Zone © 2026
</footer>

<script>
let coins=1000;

function show(title,text,html=""){
 document.getElementById("game").style.display="block";
 document.getElementById("gameTitle").textContent=title;
 document.getElementById("gameText").textContent=text;
 document.getElementById("gameArea").innerHTML=html;
 document.getElementById("result").textContent="";
 document.getElementById("game").scrollIntoView({behavior:"smooth"});
}

function msg(text){
 document.getElementById("result").textContent=text;
}

function update(){
 document.getElementById("coins").textContent=coins;
}

function reward(n){
 coins+=n;
 update();
 msg("🎉 You earned "+n+" virtual coins!");
}

function puzzle(){
 let a=[1,2,3,4,5,6,7,8,0];
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

 show("Number Puzzle","Tap a number next to the empty space.",'<div id="puzzle" style="display:grid;grid-template-columns:repeat(3,60px);gap:5px;justify-content:center"></div>');

 let b=document.getElementById("puzzle");
 let won=false;

 function draw(){
  b.innerHTML="";
  a.forEach((v,i)=>{
   let x=document.createElement("button");
   x.className="tile";
   x.textContent=v||"";
   x.disabled=!v||won;

   x.onclick=()=>{
    let z=a.indexOf(0);
    let adjacent=
      Math.abs(Math.floor(z/3)-Math.floor(i/3))+
      Math.abs(z%3-i%3)===1;

    if(adjacent){
     [a[z],a[i]]=[a[i],a[z]];
     draw();

     if(a.join(",")==="1,2,3,4,5,6,7,8,0"){
      won=true;
      reward(50);
      msg("🎉 Puzzle solved! +50 coins");
      draw();
     }
    }
   };

   b.appendChild(x);
  });
 }
 draw();
}

function race(){
 show("Aeroplane Race","Roll the dice to move your plane.",'<div id="plane" style="font-size:40px">✈️</div><p id="distance">Distance: 0 / 30</p><button id="rollDice">Roll Dice 🎲</button>');

 let distance=0;
 let finished=false;

 document.getElementById("rollDice").onclick=()=>{
  if(finished)return;
  let n=Math.floor(Math.random()*6)+1;
  distance+=n;
  document.getElementById("distance").textContent="Distance: "+Math.min(distance,30)+" / 30";
  document.getElementById("plane").textContent=distance>=30?"🏆✈️":"✈️";
  if(distance>=30){
   finished=true;
   reward(50);
   msg("You reached the finish line! +50 coins");
  }else{
   msg("You rolled "+n+"!");
  }
 };
}

function andar(){
 show("Andar Bahar","Choose a side. This is a simple random demo.",'<button id="andarBtn">Andar</button><button id="baharBtn">Bahar</button>');
 document.getElementById("andarBtn").onclick=()=>guessSide("Andar");
 document.getElementById("baharBtn").onclick=()=>guessSide("Bahar");
}

function guessSide(s){
 let w=Math.random()<0.5?"Andar":"Bahar";
 if(s===w){
  reward(20);
  msg("Correct! "+w+" wins. +20 coins");
 }else{
  msg("This round: "+w+" won. Try again!");
 }
}

function slots(){
 show("Lucky Slots","Press Spin to play.",'<div id="slot" style="font-size:38px;margin:15px">❔ ❔ ❔</div><button id="spinBtn">SPIN 🎰</button>');
 document.getElementById("spinBtn").onclick=spin;
}

function spin(){
 let symbols=["🍒","🍋","⭐","💎","7️⃣"];
 let s=Array.from({length:3},()=>symbols[Math.floor(Math.random()*symbols.length)]);
 document.getElementById("slot").textContent=s.join(" ");
 if(s[0]===s[1]&&s[1]===s[2]){
  reward(50);
  msg("Three matching symbols! +50 coins");
 }else{
  msg("Good try! Spin again.");
 }
}

function wheel(){
 show("Lucky Wheel","Spin to win virtual coins.",'<div id="wheel" style="font-size:45px">🎡</div><button id="wheelBtn">SPIN</button>');
 document.getElementById("wheelBtn").onclick=spinWheel;
}

function spinWheel(){
 let prizes=[10,20,30,50,100];
 let n=prizes[Math.floor(Math.random()*prizes.length)];
 document.getElementById("wheel").textContent="🎉";
 reward(n);
 msg("Wheel prize: "+n+" virtual coins!");
}

function flip(){
 show("Coin Flip","Choose Heads or Tails.",'<div id="coinIcon" style="font-size:45px">🪙</div><button id="headsBtn">Heads</button><button id="tailsBtn">Tails</button>');
 document.getElementById("headsBtn").onclick=()=>coin("Heads");
 document.getElementById("tailsBtn").onclick=()=>coin("Tails");
}

function coin(s){
 let w=Math.random()<0.5?"Heads":"Tails";
 document.getElementById("coinIcon").textContent=w==="Heads"?"🙂":"🪙";
 if(s===w){
  reward(10);
  msg("It was "+w+"! You won 10 coins.");
 }else{
  msg("It was "+w+". Try again!");
 }
}

function memory(){
 let values=["🐱","🐶","🍎","🚗","🐱","🐶","🍎","🚗"];
 for(let i=values.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [values[i],values[j]]=[values[j],values[i]];
 }

 show("Memory Match","Find all four matching pairs.",'<div id="mem" style="display:grid;grid-template-columns:repeat(4,55px);gap:6px;justify-content:center"></div>');

 let first=null;
 let lock=false;
 let found=0;
 let b=document.getElementById("mem");

 values.forEach(v=>{
  let x=document.createElement("button");
  x.className="memcard";
  x.textContent="❔";

  x.onclick=()=>{
   if(lock||x.dataset.open||x.dataset.found)return;

   x.textContent=v;
   x.dataset.open="1";

   if(first===null){
    first=x;
   }else{
    let previous=first;

    if(previous.textContent===x.textContent){
     previous.dataset.found="1";
     x.dataset.found="1";
     delete previous.dataset.open;
     delete x.dataset.open;
     first=null;
     found+=2;

     if(found===8){
      reward(40);
      msg("All pairs matched! +40 coins");
     }
    }else{
     lock=true;
     setTimeout(()=>{
      previous.textContent="❔";
      x.textContent="❔";
      delete previous.dataset.open;
      delete x.dataset.open;
      first=null;
      lock=false;
     },800);
    }
   }
  };

  b.appendChild(x);
 });
}

function closeGame(){
 document.getElementById("game").style.display="none";
 window.scrollTo({top:0,behavior:"smooth"});
}
</script>

</body>
</html>
