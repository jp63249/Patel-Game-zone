<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PATEL GAME ZONE - REAL CRICKET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07152a;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:16px;background:#111d35;border-bottom:3px solid #f6c445}
h1{color:#ffd34f;font-size:25px;margin:5px}
p{margin:8px}
.panel{padding:14px;max-width:850px;margin:auto}
select,button{padding:12px;border:0;border-radius:8px;font-weight:bold;font-size:15px;margin:5px}
select{background:white;color:#111}
button{background:#ffd34f;color:#15213a;cursor:pointer}
button:active{transform:scale(.96)}
.stadium{position:relative;max-width:850px;margin:12px auto;border:3px solid #b6c7d9;border-radius:12px;overflow:hidden;background:#081a30}
.sky{height:90px;background:linear-gradient(#07162d,#263c58);position:relative}
.lights{font-size:22px;letter-spacing:8px;padding:10px;color:#fff4bb}
.crowd{height:70px;background:repeating-linear-gradient(90deg,#e4a13a 0 5px,#203b76 5px 10px,#e8e5d8 10px 14px,#9e3b46 14px 19px)}
.field{height:290px;position:relative;background:radial-gradient(ellipse,#60bb47,#168239 70%,#086029);overflow:hidden}
.boundary{position:absolute;border:3px solid #d5f6bd;border-radius:50%;width:88%;height:230px;left:6%;top:25px}
.pitch{position:absolute;left:35%;top:40px;width:30%;height:210px;background:#bba77a;border-left:3px solid #e0d3ac;border-right:3px solid #e0d3ac}
.wickets{position:absolute;top:50px;left:46%;width:35px;height:15px;border-bottom:4px solid white}
.wickets:after{content:"";position:absolute;top:0;left:5px;width:4px;height:16px;background:white;box-shadow:10px 0 white,20px 0 white}
.batter{position:absolute;top:145px;left:47%;font-size:43px;z-index:3;transition:transform .2s}
.bowler{position:absolute;top:30px;left:47%;font-size:35px;z-index:3}
.ball{position:absolute;top:88px;left:48%;font-size:22px;z-index:4;display:none}
.score{background:#111d35;padding:15px;display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}
.score strong{display:block;color:#ffd34f;font-size:23px;margin-top:5px}
#message{min-height:30px;color:#ffe18a;font-weight:bold;padding:10px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;padding:10px}
.controls button{min-width:90px}
.note{font-size:12px;color:#b9c8db;padding:15px}
</style>
</head>
<body>
<header>
<h1>🏏 PATEL GAME ZONE</h1>
<p>REAL CRICKET • 5 OVER CHALLENGE</p>
</header>

<div class="panel">
<div>
<label for="team">Your Team:</label>
<select id="team">
<option>India 🇮🇳</option>
<option>Australia 🇦🇺</option>
<option>England 🏴</option>
<option>Pakistan 🇵🇰</option>
<option>New Zealand 🇳🇿</option>
<option>South Africa 🇿🇦</option>
<option>Sri Lanka 🇱🇰</option>
<option>West Indies 🌴</option>
<option>Bangladesh 🇧🇩</option>
<option>Afghanistan 🇦🇫</option>
</select>
<label for="opponent">Opponent:</label>
<select id="opponent">
<option>Australia 🇦🇺</option>
<option>India 🇮🇳</option>
<option>England 🏴</option>
<option>Pakistan 🇵🇰</option>
<option>New Zealand 🇳🇿</option>
<option>South Africa 🇿🇦</option>
<option>Sri Lanka 🇱🇰</option>
<option>West Indies 🌴</option>
<option>Bangladesh 🇧🇩</option>
<option>Afghanistan 🇦🇫</option>
</select>
<br>
<button id="start">START MATCH</button>
</div>
</div>

<div class="stadium">
<div class="sky"><div class="lights">✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦</div></div>
<div class="crowd"></div>
<div class="field">
<div class="boundary"></div>
<div class="pitch"></div>
<div class="wickets"></div>
<div class="bowler">🏃🏻</div>
<div class="batter" id="batter">🏏</div>
<div class="ball" id="ball">⚪</div>
</div>
<div class="score">
<div>TEAM<strong id="teamScore">0/0</strong></div>
<div>OVERS<strong id="overs">0.0</strong></div>
<div>TARGET<strong id="target">—</strong></div>
<div>INNINGS<strong id="innings">1</strong></div>
</div>
<div id="message">START MATCH દબાવીને રમવાનું શરૂ કરો!</div>
</div>

<div class="controls">
<button id="shot">🏏 SHOT</button>
<button id="defend">🛡️ DEFEND</button>
<button id="leave">↔️ LEAVE</button>
<button id="bowl">🎯 BOWL</button>
</div>
<p class="note">Fan-made browser cricket game • PATEL GAME ZONE</p>

<script>
const $=id=>document.getElementById(id);
let runs=0,wickets=0,balls=0,innings=1,target=0,active=false,waiting=false;
let userBatting=true,firstRuns=0,firstWickets=0,firstBalls=0;
let teamName="",oppName="";
const maxBalls=30;

function score(){
$("teamScore").textContent=runs+"/"+wickets;
$("overs").textContent=Math.floor(balls/6)+"."+(balls%6);
$("target").textContent=target||"—";
$("innings").textContent=innings;
}
function say(t){$("message").textContent=t}
function reset(){
runs=0;wickets=0;balls=0;innings=1;target=0;
firstRuns=0;firstWickets=0;firstBalls=0;
userBatting=true;active=true;waiting=false;score();
say(teamName+" batting first! Tap SHOT when the ball comes.");
}
$("start").addEventListener("click",()=>{
teamName=$("team").value;oppName=$("opponent").value;
if(teamName===oppName){say("બે અલગ ટીમ પસંદ કરો!");return}
reset();
});
function finishBall(add, wicket, message){
if(!active||waiting)return;
waiting=true;
runs+=add;
if(wicket)wickets++;
balls++;
score();say(message);
$("batter").style.transform="rotate(-35deg) scale(1.15)";
setTimeout(()=>{
$("batter").style.transform="";
waiting=false;
if(wickets>=10||balls>=maxBalls||(innings===2&&runs>=target)){
endInnings();
}else if(!userBatting){
computerBall();
}
},550);
}
function endInnings(){
if(innings===1){
firstRuns=runs;firstWickets=wickets;firstBalls=balls;
target=firstRuns+1;innings=2;runs=0;wickets=0;balls=0;
userBatting=false;score();
say(oppName+" needs "+target+" runs. Tap BOWL to bowl!");
}else{
active=false;score();
let result=runs>=target?oppName+" wins!":runs===firstRuns? "Match tied!":teamName+" wins!";
say("🏆 "+result+" Final: "+teamName+" "+firstRuns+"/"+firstWickets+" • "+oppName+" "+runs+"/"+wickets);
}
}
function animateBall(callback){
if(!active||waiting)return;
waiting=true;
const b=$("ball");b.style.display="block";b.style.left="48%";b.style.top="75px";
let step=0;
const timer=setInterval(()=>{
step++;b.style.left=(48+step*1.2)+"%";b.style.top=(75+step*4)+"px";
if(step>=8){clearInterval(timer);b.style.display="none";callback()}
},35);
}
function computerBall(){
if(!active||userBatting||waiting)return;
animateBall(()=>{
const r=Math.random();
if(r<.08)finishBall(0,true,"Computer wicket! OUT!");
else if(r<.35)finishBall(0,false,"Dot ball! Good bowling!");
else if(r<.65)finishBall(1,false,"Computer takes 1 run.");
else if(r<.82)finishBall(2,false,"Computer runs 2!");
else if(r<.94)finishBall(4,false,"Computer hits FOUR!");
else finishBall(6,false,"Computer hits SIX!");
});
}
function playShot(kind){
if(!active){say("પહેલા START MATCH દબાવો!");return}
if(!userBatting){say("હવે તમે bowling કરો! BOWL દબાવો.");return}
if(waiting)return;
animateBall(()=>{
const r=Math.random();
if(kind==="DEFEND"){
if(r<.12)finishBall(0,true,"Defend failed! OUT!");
else finishBall(0,false,"Nice defence. Dot ball.");
}else if(kind==="LEAVE"){
if(r<.8)finishBall(0,false,"You leave the ball. Dot ball.");
else finishBall(0,false,"Wide outside off! No run in this simple mode.");
}else{
if(r<.08)finishBall(0,true,"Bowled! You're OUT!");
else if(r<.23)finishBall(0,false,"Beaten! Dot ball.");
else if(r<.43)finishBall(1,false,"Good shot! 1 run.");
else if(r<.58)finishBall(2,false,"Excellent running! 2 runs.");
else if(r<.76)finishBall(4,false,"🏏 FOUR! Beautiful shot!");
else finishBall(6,false,"🚀 SIX! Out of the ground!");
}
});
}
$("shot").addEventListener("click",()=>playShot("SHOT"));
$("defend").addEventListener("click",()=>playShot("DEFEND"));
$("leave").addEventListener("click",()=>playShot("LEAVE"));
$("bowl").addEventListener("click",()=>{
if(!active){say("પહેલા START MATCH દબાવો!");return}
if(userBatting){say("હાલ તમે batting કરો છો. SHOT દબાવો!");return}
if(waiting)return;
waiting=true;
animateBall(()=>{
waiting=false;
const r=Math.random();
if(r<.12)finishBall(0,true,"🎯 WICKET! You got the batter!");
else if(r<.4)finishBall(0,false,"Dot ball! Great bowling.");
else if(r<.67)finishBall(1,false,"Computer takes one run.");
else if(r<.82)finishBall(2,false,"Computer takes two runs.");
else if(r<.94)finishBall(4,false,"Computer hits FOUR!");
else finishBall(6,false,"Computer hits SIX!");
});
});
</script>
</body>
</html>
